name: Sestav APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rozbal projekt ze ZIPu
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z"; done
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (předinstalované na runneru)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sestav APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Přejmenuj
        run: cp app/build/outputs/apk/debug/app-debug.apk Nula100.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nula100-apk
          path: Nula100.apk

      - name: Zveřejni ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Nula100 build ${{ github.run_number }}
          files: Nula100.apk
